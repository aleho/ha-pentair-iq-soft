[project]
name = "ha-pentair-iq-soft"
version = "0.0.1"
description = "Custom integration for Pentair IQ Soft Cabinet Softener"
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
authors = [{ name = "Alexander Hofbauer" }]
keywords = ["pentair", "IQ soft", "softener"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["homeassistant==2026.9.3"]

[tool.setuptools]
py-modules = ["custom_components"]

[project.urls]
Repository = "https://github.com/aleho/ha-pentair-iq-soft"

[tool.ruff]
target-version = "py314"
src = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
